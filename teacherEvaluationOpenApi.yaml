openapi: 3.1.0
info:
  title: Teacher Evaluation API
  description: REST API for presenting grades of students' tests and their trends
  version: 1.0.0

servers:
  - url: https://api.example.com
    description: API server (replace with your actual host)

paths:
  /plots/distribution/{test_name}:
    get:
      summary: Show distribution of scores
      description: >
        Shows the distribution of scores of a single test, getting them by the name of the test
      operationId: show_grade_distribution
      tags: [plots]
      parameters:
        - name: test_name
          in: path
          required: true
          description: The test name that the graph will be created for it
          schema:
            type: string
            example: Math_Exam
      responses:
        '200':
          description: Graph created successfully
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'

  /plots/distribution/{test_name}/{grade_level}:
    get:
      summary: Show distribution of scores
      description: >
        Shows the distribution of scores of a single test of a single class, getting them by the name of the test
      operationId: show_grade_distribution_of_class
      tags: [plots]
      parameters:
        - name: test_name
          in: path
          required: true
          description: The test name that the graph will be created for it
          schema:
            type: string
            example: Math_Exam
        - name: grade_level
          in: path
          required: true
          description: The grade level (class) that the graph will be created for it
          schema:
            type: string
            example: 'י"ב1'
      responses:
        '200':
          description: Graph created successfully
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'

  /plots/student_grade_spread/{student_id}:
    get:
      summary: Show scores of a single student
      description: >
        Shows the distribution of scores of a single student
      operationId: student_grades_graph
      tags: [plots]
      parameters:
        - name: student_id
          in: path
          required: true
          description: The id of the student in questin, for getting its scores
          schema:
            type: integer
            example: 307960421
      responses:
        '200':
          description: Graph created successfully
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'

  /plots/passed-and-failed:
    get:
      summary: Show amounts of student who passed and failed a certain test
      description: >
        Shows the distribution of scores of a single student
      operationId: student_grades_graph
      tags: [plots]
      parameters:
        - name: student_id
          in: query
          required: true
          description: The id of the student in questin, for getting its scores
          schema:
            type: integer
            example: 307960421
      responses:
        '200':
          description: Graph created successfully
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'

  /stats/avg/{test_name}:
    get:
      summary: Show average of a test
      description: >
        Shows the average score of a single test
      operationId: test_average
      tags: [stats]
      parameters:
        - name: test_name
          in: path
          required: true
          description: The test name that the graph will be created for it
          schema:
            type: string
            example: "מבחן past simple"
      responses:
        '200':
          description: Average shows successfully
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'

  /stats/med/{test_name}:
    get:
      summary: Show median of a test
      description: >
        Shows the median score of a single test
      operationId: test_median
      tags: [stats]
      parameters:
        - name: test_name
          in: path
          required: true
          description: The test name that the graph will be created for it
          schema:
            type: string
            example: "מבחן past simple"
      responses:
        '200':
          description: Median shows successfully
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'

  /stats/percent/25th/{test_name}:
    get:
      summary: Show 25th percent of a test
      description: >
        Shows the 25th percent score of a single test,
        which means that 25% of the scores are lower than it and 75% of the scores are above it
      operationId: test_percent_25th
      tags: [stats]
      parameters:
        - name: test_name
          in: path
          required: true
          description: The test name that the graph will be created for it
          schema:
            type: string
            example: "מבחן past simple"
      responses:
        '200':
          description: 25th percent shows successfully
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'

  /stats/percent/75th/{test_name}:
    get:
      summary: Show 75th percent of a test
      description: >
        Shows the 75th percent score of a single test,
        which means that 75% of the scores are lower than it and 25% of the scores are above it
      operationId: test_percent_75th
      tags: [stats]
      parameters:
        - name: test_name
          in: path
          required: true
          description: The test name that the graph will be created for it
          schema:
            type: string
            example: "מבחן past simple"
      responses:
        '200':
          description: 75th percent shows successfully
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'

  /teacher/add/grades:
    get:
      summary: Add score to student
      description: >
        Adds a score to a student, given the student's Id
      operationId: add_score_to_student
      tags: [ teacher ]
      parameters:
        - name: student_id
          in: query
          required: true
          description: The student's id
          schema:
            type: integer
            example: 307957682
        - name: test_name
          in: query
          required: true
          description: The test name that the graph will be created for it
          schema:
            type: string
            example: "מבחן past simple"
        - name: score
          in: query
          required: true
          description: The student's score on the test
          schema:
            type: integer
            example: 85
        - name: comments
          in: query
          required: true
          description: comments of the teacher about the score
          schema:
            type: string
            example: "amazing"
        - name: test_date
          in: query
          required: true
          description: the date that the test has occurred
          schema:
            type: date-time
            example: "2026-07-21T10:00:00Z"
      responses:
        '200':
          description: 75th percent shows successfully
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'

  /teacher/change/grade:
    get:
      summary: change grade of student
      description: >
        Changes grade level of a student, given student's Id
      operationId: add_score_to_student
      tags: [ teacher ]
      parameters:
        - name: student_id
          in: query
          required: true
          description: The student's id
          schema:
            type: integer
            example: 307957682
        - name: new_grade_level
          in: query
          required: true
          description: The new grade level of a student
          schema:
            type: string
            example: 'י"ב1'
      responses:
        '200':
          description: 75th percent shows successfully
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: 404
        message:
          type: string
          example: Note not found
        details:
          type: array
          items:
            type: string
          example:
            - "Couldn't find the student with the given ID"

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/Error'

  responses:
    NotFound:
      description: The requested note does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: "Student not found"

    BadRequest:
      description: Request payload failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Validation error
            details:
               - "Couldn't find the student with the given ID"

    ValidationError:
      description: Request payload failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 422
            message: Validation error
            details:
              - "Student id: must be an integer"
              - "Student name: must be a string"